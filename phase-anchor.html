<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Phase Anchor — Stitser BUILT</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Phase Anchor" />
  <meta name="application-name" content="Phase Anchor" />
  <meta name="theme-color" content="#0a0d14" />
  <link rel="manifest" href="/phase-anchor-manifest.json" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/clint-stitser/kompass-app/main/apple-touch-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e8eaf0;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    :root{--p1:#22c55e;--p1-bg:#052e16;--p1-border:#166534;--p1-muted:#4ade80;--p2:#f97316;--p2-bg:#1c1007;--p2-border:#7c2d12;--p2-muted:#fb923c;--p3:#a855f7;--p3-bg:#1a0a2e;--p3-border:#581c87;--p3-muted:#c084fc;--g:#22c55e;--y:#f59e0b;--r:#ef4444;--gold:#c9a84c}
    #react-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:#4b5563}
    #react-loading .spin{width:24px;height:24px;border:2px solid #1e2336;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
    #react-loading p{font-size:12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hdr{background:#0a0d14;border-bottom:1px solid #1e2336;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:12px;flex-wrap:wrap}
    .hdr-left{display:flex;align-items:center;gap:10px}
    .hdr-kompass-logo{width:36px;height:36px;border-radius:10px;background:#181c28;border:1px solid #2d3555;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
    .hdr-kompass-logo img{width:36px;height:36px;border-radius:10px;object-fit:cover}
    .hdr-text .hdr-title{font-size:15px;font-weight:700;color:#f1f5f9}
    .hdr-text .hdr-sub{font-size:10px;color:#6b7280;margin-top:1px}
    .hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .snap-btn{padding:6px 14px;font-size:11px;font-weight:700;background:#1e2336;border:1px solid #2d3555;border-radius:7px;color:#94a3b8;cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
    .snap-btn:hover{border-color:var(--gold);color:var(--gold)}
    .ovr{background:#1e2336;border:1px solid #2d3555;border-radius:8px;padding:5px 12px;text-align:center}
    .ovr-pct{font-size:18px;font-weight:800;color:#f1f5f9;line-height:1}
    .ovr-lbl{font-size:9px;color:#6b7280;margin-top:2px}
    .leg{display:flex;gap:14px;padding:8px 18px;background:#0a0d14;border-bottom:1px solid #1e2336;flex-wrap:wrap;align-items:center}
    .leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#94a3b8}
    .leg-dot{width:9px;height:9px;border-radius:50%}
    .leg-right{margin-left:auto;font-size:10px;color:#374151}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:11px;padding:14px;max-width:1600px;margin:0 auto}
    .card{border-radius:12px;overflow:hidden;border:1px solid;transition:transform .15s}
    .card.p1{background:var(--p1-bg);border-color:var(--p1-border)}
    .card.p2{background:var(--p2-bg);border-color:var(--p2-border)}
    .card.p3{background:var(--p3-bg);border-color:var(--p3-border)}
    .card-header-bar{display:flex;align-items:center;justify-content:space-between;padding:11px 15px 9px;cursor:pointer;user-select:none;gap:8px}
    .card-header-left{display:flex;flex-direction:column;flex:1;min-width:0}
    .card-id{font-size:10px;font-weight:700;letter-spacing:.1em;opacity:.5;text-transform:uppercase;margin-bottom:2px}
    .card-name{font-size:14px;font-weight:700;color:#f1f5f9;line-height:1.3}
    .card-header-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
    .pbadge{flex-shrink:0;border-radius:20px;padding:3px 9px;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
    .p1 .pbadge{background:#166534;color:#4ade80}
    .p2 .pbadge{background:#7c2d12;color:#fb923c}
    .p3 .pbadge{background:#581c87;color:#c084fc}
    .card-collapse-icon{font-size:11px;color:#4b5563;transition:transform .2s;display:inline-block;line-height:1}
    .card-collapse-icon.open{transform:rotate(180deg)}
    .card-body{overflow:hidden;transition:max-height .3s ease}
    .card-body.collapsed{max-height:0!important}
    .prog{padding:0 15px 9px}
    .prog-row{display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px;color:#94a3b8}
    .prog-row span:last-child{font-weight:700}
    .prog-track{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
    .prog-fill{height:100%;border-radius:3px;transition:width .4s}
    .p1 .prog-fill{background:linear-gradient(90deg,#166534,#22c55e)}
    .p2 .prog-fill{background:linear-gradient(90deg,#7c2d12,#f97316)}
    .p3 .prog-fill{background:linear-gradient(90deg,#581c87,#a855f7)}
    .target-date{padding:4px 15px 8px;font-size:10px;color:#6b7280;display:flex;align-items:center;gap:5px;border-top:1px solid rgba(255,255,255,.04);margin-top:2px;cursor:pointer;justify-content:space-between}
    .hwk{padding:0 15px 10px}
    .hwk-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;color:#6b7280;text-transform:uppercase;margin-bottom:5px}
    .hwk-item{display:flex;align-items:flex-start;gap:7px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
    .hwk-item:last-child{border:none}
    .chk{width:15px;height:15px;border-radius:4px;border:1.5px solid;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .p1 .chk{border-color:var(--p1-border)} .p2 .chk{border-color:var(--p2-border)} .p3 .chk{border-color:var(--p3-border)}
    .chk.on{border-color:transparent}
    .p1 .chk.on{background:var(--p1)} .p2 .chk.on{background:var(--p2)} .p3 .chk.on{background:var(--p3)}
    .chk svg{width:9px;height:9px}
    .hwk-txt{font-size:11px;line-height:1.4;color:#d1d5db;flex:1}
    .hwk-txt.done{text-decoration:line-through;opacity:.45}
    .card-actions{padding:0 15px 10px;display:flex;gap:7px}
    .act-btn{flex:1;padding:5px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);font-size:10px;font-weight:700;color:#6b7280;cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.03em}
    .act-btn:hover{color:#d1d5db;border-color:#374151}
    .exp-tog{padding:7px 15px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;color:#4b5563;cursor:pointer;transition:color .15s}
    .exp-tog.open svg,.card:hover .exp-tog{color:#6b7280}
    .exp-tog svg{transition:transform .2s;width:11px;height:11px}
    .exp-tog.open svg{transform:rotate(180deg)}
    .exp-detail{padding:0 15px 14px}
    .pnav{display:flex;gap:7px;margin-bottom:12px}
    .pnav-btn{flex:1;padding:5px 3px;border-radius:6px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);font-size:9px;font-weight:700;color:#6b7280;cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.04em}
    .pnav-btn.a1{border-color:var(--p1-border);background:var(--p1-bg);color:var(--p1-muted)}
    .pnav-btn.a2{border-color:var(--p2-border);background:var(--p2-bg);color:var(--p2-muted)}
    .pnav-btn.a3{border-color:var(--p3-border);background:var(--p3-bg);color:var(--p3-muted)}
    .psec{margin-bottom:14px}
    .psec-hd{display:flex;align-items:center;gap:7px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.05)}
    .psec-badge{font-size:8px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:9px;text-transform:uppercase}
    .psec-badge.b1{background:#166534;color:#4ade80} .psec-badge.b2{background:#7c2d12;color:#fb923c} .psec-badge.b3{background:#581c87;color:#c084fc}
    .psec-ttl{font-size:10px;font-weight:600;color:#94a3b8}
    .pbullets{list-style:none}
    .pbullets li{font-size:10px;color:#9ca3af;padding:2px 0 2px 11px;position:relative;line-height:1.4}
    .pbullets li::before{content:'·';position:absolute;left:2px;color:#374151}
    .hwk-callout{background:rgba(255,255,255,.03);border-radius:5px;padding:7px 9px;margin-top:5px;font-size:10px;color:#94a3b8;line-height:1.5}
    .hwk-callout strong{color:#f1f5f9;font-size:9px;letter-spacing:.05em;text-transform:uppercase}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:#131720;border:1px solid #2d3555;border-radius:14px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto}
    .modal-hd{padding:18px 20px 12px;border-bottom:1px solid #1e2336;display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-size:15px;font-weight:700;color:#f1f5f9}
    .modal-close{background:none;border:none;color:#6b7280;font-size:20px;cursor:pointer;line-height:1;padding:2px 6px}
    .modal-body{padding:16px 20px} .modal-section{margin-bottom:20px}
    .modal-section-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b7280;margin-bottom:10px}
    .date-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .date-field label{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
    .date-field.f1 label{color:var(--p1-muted)} .date-field.f2 label{color:var(--p2-muted)} .date-field.f3 label{color:var(--p3-muted)}
    .date-field input[type=date]{width:100%;background:#1e2336;border:1px solid #2d3555;border-radius:6px;padding:6px 8px;font-size:11px;color:#f1f5f9;outline:none}
    .outcome-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
    .outcome-item{display:flex;align-items:center;gap:7px;padding:6px 9px;background:#1a1f2e;border-radius:7px;border:1px solid #2d3555}
    .outcome-item input[type=text]{flex:1;background:transparent;border:none;color:#f1f5f9;font-size:12px;outline:none}
    .out-del{background:none;border:none;color:#4b5563;font-size:16px;cursor:pointer;line-height:1;padding:0 2px;flex-shrink:0}
    .out-del:hover{color:#ef4444}
    .add-outcome-btn{width:100%;padding:7px;border:1px dashed #2d3555;border-radius:7px;background:transparent;color:#6b7280;font-size:11px;cursor:pointer;transition:all .15s}
    .modal-tabs{display:flex;gap:6px;margin-bottom:12px}
    .modal-tab{padding:4px 12px;border-radius:6px;border:1px solid #2d3555;background:transparent;font-size:10px;font-weight:700;color:#6b7280;cursor:pointer;letter-spacing:.04em}
    .modal-tab.at1{border-color:var(--p1-border);background:var(--p1-bg);color:var(--p1-muted)}
    .modal-tab.at2{border-color:var(--p2-border);background:var(--p2-bg);color:var(--p2-muted)}
    .modal-tab.at3{border-color:var(--p3-border);background:var(--p3-bg);color:var(--p3-muted)}
    .modal-foot{padding:12px 20px 16px;border-top:1px solid #1e2336;display:flex;justify-content:flex-end;gap:8px}
    .btn-save{padding:7px 18px;background:#2d3555;border:1px solid #4b5563;border-radius:7px;color:#f1f5f9;font-size:12px;font-weight:700;cursor:pointer}
    .btn-cancel{padding:7px 18px;background:transparent;border:1px solid #2d3555;border-radius:7px;color:#6b7280;font-size:12px;cursor:pointer}
    .detail-page{max-width:1000px;margin:0 auto;padding:18px}
    .detail-back{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280;cursor:pointer;margin-bottom:16px;background:none;border:none}
    .detail-id{font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.5;text-transform:uppercase}
    .detail-name{font-size:22px;font-weight:800;color:#f1f5f9;margin-bottom:12px}
    .timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid #1e2336;border-radius:12px;overflow:hidden;margin-bottom:20px}
    .tl-phase{padding:16px;border-right:1px solid #1e2336;position:relative}
    .tl-phase:last-child{border-right:none}
    .tl-phase.tl-current{outline:2px solid;outline-offset:-2px}
    .tl-phase.tl-p1{background:var(--p1-bg)} .tl-phase.tl-p2{background:var(--p2-bg)} .tl-phase.tl-p3{background:var(--p3-bg)}
    .tl-phase.tl-current.tl-p1{outline-color:var(--p1)} .tl-phase.tl-current.tl-p2{outline-color:var(--p2)} .tl-phase.tl-current.tl-p3{outline-color:var(--p3)}
    .tl-num{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:3px}
    .tl-pname{font-size:13px;font-weight:700;margin-bottom:8px}
    .tl-p1 .tl-pname{color:var(--p1-muted)} .tl-p2 .tl-pname{color:var(--p2-muted)} .tl-p3 .tl-pname{color:var(--p3-muted)}
    .tl-current-badge{position:absolute;top:12px;right:12px;font-size:8px;font-weight:800;padding:2px 7px;border-radius:8px;text-transform:uppercase;letter-spacing:.07em}
    .tl-p1 .tl-current-badge{background:#166534;color:#4ade80} .tl-p2 .tl-current-badge{background:#7c2d12;color:#fb923c} .tl-p3 .tl-current-badge{background:#581c87;color:#c084fc}
    .tl-date-lbl{font-size:9px;color:#6b7280;margin-bottom:2px}
    .tl-date-val{font-size:13px;font-weight:700;color:#94a3b8}
    .tl-prog{margin-top:10px}
    .tl-prog-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
    .tl-prog-fill{height:100%;border-radius:2px}
    .tl-p1 .tl-prog-fill{background:var(--p1)} .tl-p2 .tl-prog-fill{background:var(--p2)} .tl-p3 .tl-prog-fill{background:var(--p3)}
    .tl-pct{font-size:10px;font-weight:700;color:#94a3b8}
    .roadmap-table{width:100%;border-collapse:separate;border-spacing:0;border-radius:10px;overflow:hidden;margin-bottom:20px}
    .roadmap-table th{padding:10px 14px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-align:left}
    .roadmap-table th.h1{background:#166534;color:#4ade80} .roadmap-table th.h2{background:#7c2d12;color:#fb923c} .roadmap-table th.h3{background:#581c87;color:#c084fc}
    .roadmap-table td{padding:6px 14px;font-size:11px;line-height:1.5;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.05)}
    .roadmap-table td.c1{background:var(--p1-bg);color:#d1d5db;border-right:1px solid rgba(255,255,255,.05)}
    .roadmap-table td.c2{background:var(--p2-bg);color:#d1d5db;border-right:1px solid rgba(255,255,255,.05)}
    .roadmap-table td.c3{background:var(--p3-bg);color:#d1d5db}
    .roadmap-table tr:last-child td{border-bottom:none}
    .roadmap-hwk-row td{padding:10px 14px;font-size:10px;font-style:italic;color:#94a3b8;border-top:1px solid rgba(255,255,255,.08)}
    .roadmap-hwk-row td strong{display:block;font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-style:normal;margin-bottom:3px}
    .roadmap-hwk-row td.c1 strong{color:var(--p1-muted)} .roadmap-hwk-row td.c2 strong{color:var(--p2-muted)} .roadmap-hwk-row td.c3 strong{color:var(--p3-muted)}
    .gyr-row{display:flex;align-items:center;gap:8px;padding:8px 15px;border-top:1px solid rgba(255,255,255,.05)}
    .gyr-lbl{font-size:10px;color:#6b7280;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-right:4px}
    .gyr-btn{padding:3px 10px;border-radius:5px;border:1px solid;font-size:10px;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.04em}
    .gyr-btn.G{border-color:var(--g);color:var(--g);background:rgba(34,197,94,.1)} .gyr-btn.G.sel{background:rgba(34,197,94,.25)}
    .gyr-btn.Y{border-color:var(--y);color:var(--y);background:rgba(245,158,11,.1)} .gyr-btn.Y.sel{background:rgba(245,158,11,.25)}
    .gyr-btn.R{border-color:var(--r);color:var(--r);background:rgba(239,68,68,.1)} .gyr-btn.R.sel{background:rgba(239,68,68,.25)}
    .gyr-btn:not(.sel){opacity:.4}
    .gyr-notes{flex:1}
    .gyr-notes input{width:100%;background:transparent;border:none;border-bottom:1px solid #2d3555;color:#d1d5db;font-size:11px;padding:2px 0;outline:none}
    .save-toast{position:fixed;bottom:20px;right:20px;background:#1e2336;border:1px solid #374151;border-radius:8px;padding:8px 16px;font-size:11px;color:#94a3b8;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
    .save-toast.show{opacity:1}
    @media(max-width:640px){.grid{grid-template-columns:1fr;padding:10px;gap:9px}.hdr{padding:9px 13px}.timeline{grid-template-columns:1fr}.tl-phase{border-right:none;border-bottom:1px solid #1e2336}.tl-phase:last-child{border-bottom:none}}
    .kl-wrap{position:sticky;top:0;z-index:190}
    .kl-bar{background:#0a0d14;border-bottom:1px solid #1e2336;padding:0 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;min-height:40px}
    .kl-bar-left{display:flex;align-items:center;gap:10px;padding:9px 0}
    .kl-compass{width:22px;height:22px;border-radius:6px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .kl-bar-title{font-size:12px;font-weight:700;color:#f1f5f9;letter-spacing:.02em}
    .kl-bar-sub{font-size:10px;color:#6b7280;margin-left:6px}
    .kl-bar-right{display:flex;align-items:center;gap:8px}
    .kl-count{font-size:10px;color:#6b7280;background:#1a1f2e;border:1px solid #2d3555;border-radius:12px;padding:2px 9px}
    .kl-chevron{font-size:11px;color:#4b5563;transition:transform .2s;display:inline-block}
    .kl-chevron.open{transform:rotate(180deg)}
    .kl-panel{display:none;background:#080b10;border-bottom:2px solid #1e2336;padding:14px 18px;max-height:70vh;overflow-y:auto}
    .kl-panel.open{display:block}
    .kl-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
    .kl-tab{padding:5px 12px;font-size:11px;font-weight:600;border-radius:6px;border:1px solid #2d3555;background:transparent;color:#6b7280;cursor:pointer;white-space:nowrap;font-family:inherit}
    .kl-tab.active{background:rgba(201,168,76,.13);color:var(--gold);border-color:rgba(201,168,76,.35)}
    .kl-search{width:100%;background:#131720;border:1px solid #2d3555;border-radius:8px;padding:8px 12px;color:#e8eaf0;font-size:13px;outline:none;font-family:inherit;margin-bottom:10px;box-sizing:border-box}
    .kl-search:focus{border-color:var(--gold)}
    .kl-search::placeholder{color:#4b5563}
    .kl-section-label{font-size:9px;font-weight:700;letter-spacing:.1em;color:#4b5563;text-transform:uppercase;margin:10px 0 6px 2px}
    .kl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px;margin-bottom:4px}
    .kl-card{background:#0f1420;border:1px solid #1e2336;border-radius:10px;overflow:hidden;cursor:pointer}
    .kl-card:active{transform:scale(.97)}

  function openClaude(pid){
    // window.location.href is the only reliable deep-link trigger on iOS Safari.
    // The iframe approach silently fails in mobile Safari.
    // We navigate to the claude:// scheme, then fall back to the web URL after
    // 1.5s if the app doesn't intercept (not installed / scheme not registered).
    // The 'blur' event fires when iOS switches to the Claude app, cancelling the fallback.
    var webUrl='https://claude.ai/project/'+pid;
    var fallback=setTimeout(function(){window.open(webUrl,'_blank');},1500);
    window.addEventListener('blur',function onBlur(){
      clearTimeout(fallback);
      window.removeEventListener('blur',onBlur);
    });
    window.location.href='claude://project/'+pid;
  }
  var ITEMS=[
    {id:"morning",layer:"rituals",icon:"&#127749;",name:"Morning ritual",desc:"13-step daily launch sequence",p:"personal",prompt:"Morning ritual",why:"Sets your direction before the day runs you."},
    {id:"evening",layer:"rituals",icon:"&#127769;",name:"Evening ritual",desc:"Debrief, score, capture for tomorrow",p:"personal",prompt:"Evening ritual",why:"Close the loop. Score your Big 3."},
    {id:"weekly",layer:"rituals",icon:"&#128197;",name:"Weekly review",desc:"Dominos, wins, course correction",p:"personal",prompt:"Weekly review",why:"Bridge between daily execution and annual goals."},
    {id:"war",layer:"rituals",icon:"&#9889;",name:"WAR stack",desc:"Decision-prep for high-stakes moments",p:"personal",prompt:"Let's do a WAR stack",why:"Converts reactive emotion into grounded decisions."},
    {id:"irritate",layer:"rituals",icon:"&#128293;",name:"Irritation stack",desc:"Process friction before it becomes reaction",p:"personal",prompt:"Let's do an irritation stack",why:"Clears noise so facts emerge."},
    {id:"discovery",layer:"rituals",icon:"&#128161;",name:"Discovery stack",desc:"Capture insight, learning, or idea",p:"personal",prompt:"Let's do a discovery stack",why:"Externalizes the spider-web mind before insights evaporate."},
    {id:"cash",layer:"rituals",icon:"&#128181;",name:"Cash stack",desc:"Process money stress or financial decision",p:"personal",prompt:"Let's do a cash stack",why:"Moves from fear-based to facts-based thinking."},
    {id:"relcoach",layer:"rituals",icon:"&#129309;",name:"Relationship coach",desc:"Navigate family dynamics — Christie, kids, Gwen",p:"personal",prompt:"Help me navigate a situation with ",why:"Human Design + family profile context applied before you react."},

    if(!f.length){c.innerHTML="<div class='kl-empty'>No matches</div>";return;}
    var h="";
    (activeTab==="all"?LAYER_ORDER:[activeTab]).forEach(function(l){

};
const getHwkChecked=(ds,phase)=>{
  const p=phase||ds.currentPhase||1;

};

function EditModal({domain:d,ds,phase,onSave,onClose}){
  const[tab,setTab]=useState(phase||1);
  const[dates,setDates]=useState({1:ds.phaseTargetDates?.[1]||'',2:ds.phaseTargetDates?.[2]||'',3:ds.phaseTargetDates?.[3]||''});
  const[custom,setCustom]=useState(()=>{
    const b={};
    [1,2,3].forEach(p=>{
      b[p]=ds.customHwkItems?.[p]
        ? ds.customHwkItems[p].map(t=>({text:t,locked:false}))
        : d.hwkItems[p].map(t=>({text:t,locked:true}));
    });
    return b;
  });
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-hd"><div className="modal-title">{d.label} · Edit Checklist</div><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="modal-section"><div className="modal-section-title">Phase Target Dates</div><div className="date-grid">{[1,2,3].map(p=>(<div key={p} className={`date-field f${p}`}><label>Phase {p} · {d.phases[p].name}</label><input type="date" value={dates[p]} onChange={e=>setDates(v=>({...v,[p]:e.target.value}))}/></div>))}</div></div>
          <div className="modal-section">

            <div className="modal-tabs">{[1,2,3].map(p=>(<button key={p} className={`modal-tab ${tab===p?`at${p}`:''}`} onClick={()=>setTab(p)}>Phase {p} · {d.phases[p].name}</button>))}</div>
            <div className="outcome-list">{custom[tab].map((item,i)=>(<div key={i} className="outcome-item"><input type="text" value={item.text} placeholder="Add criteria..." onChange={e=>setCustom(c=>({...c,[tab]:c[tab].map((it,j)=>j===i?{...it,text:e.target.value}:it)}))} readOnly={item.locked} style={item.locked?{opacity:.6}:{}}/>{!item.locked&&<button className="out-del" onClick={()=>setCustom(c=>({...c,[tab]:c[tab].filter((_,j)=>j!==i)}))}>×</button>}</div>))}</div>
            <button className="add-outcome-btn" onClick={()=>setCustom(c=>({...c,[tab]:[...c[tab],{text:'',locked:false}]}))}>+ Add criteria to Phase {tab}</button>
          </div>
        </div>
        <div className="modal-foot"><button className="btn-cancel" onClick={onClose}>Cancel</button><button className="btn-save" onClick={()=>{
          const customHwkItems={};
          [1,2,3].forEach(p=>{customHwkItems[p]=custom[p].map(i=>i.text).filter(t=>t.trim());});
          onSave({phaseTargetDates:dates,customHwkItems});
          onClose();
        }}>Save Changes</button></div>
      </div>
    </div>
  );
}

function DomainCard({domain:d,ds,onToggleHwk,onSetPhase,onOpenDetail,onEdit,onSetGyr,onSetGyrNotes,showGyr}){
  const[expanded,setExpanded]=useState(false);
  const[collapsed,setCollapsed]=useState(false);
  const phase=ds.currentPhase||1,pcfg=PCFG[phase];
  const hwkItems=getHwkItems(d,ds,phase);
  const hwkChecked=getHwkChecked(ds,phase);
  const pct=hwkItems.length>0?Math.round(hwkChecked.filter(Boolean).length/hwkItems.length*100):0;
  const targetDate=ds.phaseTargetDates?.[phase],gyr=ds.gyrOverride||GYR_AUTO(pct);
  const ds2=(()=>{
    if(!targetDate)return{label:'No target date set',color:'#374151',icon:'📅'};
    const today=new Date();today.setHours(0,0,0,0);
    const target=new Date(targetDate+'T12:00:00'),diff=Math.round((target-today)/86400000);
    const fmt=target.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    if(diff<0)return{label:fmt,color:'#ef4444',icon:'⚠',note:`${Math.abs(diff)}d overdue`};
    if(diff<=14)return{label:fmt,color:'#f59e0b',icon:'🔥',note:`${diff}d away`};
    if(diff<=30)return{label:fmt,color:'#f97316',icon:'📅',note:`${diff}d away`};
    return{label:fmt,color:'#94a3b8',icon:'📅',note:`${diff}d away`};
  })();
  return(
    <div className={`card ${pcfg.cls}`}>
      <div className="card-header-bar" onClick={()=>setCollapsed(c=>!c)}>
        <div className="card-header-left"><div className="card-id">{d.id}</div><div className="card-name">{d.label}</div></div>
        <div className="card-header-right"><div className="pbadge">{pcfg.badge}</div><span className={`card-collapse-icon ${collapsed?'':'open'}`}>▾</span></div>
      </div>
      <div className={`card-body ${collapsed?'collapsed':''}`} style={{maxHeight:collapsed?0:2000}}>
        <div className="prog"><div className="prog-row"><span>Phase Gate Progress</span><span>{pct}%</span></div><div className="prog-track"><div className="prog-fill" style={{width:`${pct}%`}}/></div></div>
        <div className="target-date" onClick={()=>onOpenDetail(d.id)}>
          <div style={{display:'flex',alignItems:'center',gap:5}}><span style={{fontSize:11}}>{ds2.icon}</span><span style={{color:'#6b7280'}}>Phase {phase} target:</span><span style={{color:ds2.color,fontWeight:700}}>{ds2.label}</span></div>
          {ds2.note&&targetDate&&<span style={{fontSize:9,fontWeight:700,padding:'1px 6px',borderRadius:4,background:ds2.color==='#ef4444'?'rgba(239,68,68,.12)':ds2.color==='#f59e0b'?'rgba(245,158,11,.12)':'rgba(255,255,255,.06)',color:ds2.color}}>{ds2.note}</span>}
        </div>
        <div className="hwk" onClick={e=>e.stopPropagation()}>
          <div className="hwk-lbl">✓ How We Know · Phase {phase}</div>
          {hwkItems.map((item,i)=>(<div key={i} className="hwk-item" onClick={()=>onToggleHwk(d.id,phase,i)}><div className={`chk ${hwkChecked[i]?'on':''}`}>{hwkChecked[i]&&<CheckIco/>}</div><div className={`hwk-txt ${hwkChecked[i]?'done':''}`}>{item}</div></div>))}
        </div>
        {showGyr&&(<div className="gyr-row" onClick={e=>e.stopPropagation()}><span className="gyr-lbl">Status</span>{['G','Y','R'].map(g=>(<button key={g} className={`gyr-btn ${g} ${gyr===g?'sel':''}`} onClick={()=>onSetGyr(d.id,ds.gyrOverride===g?null:g)}>{g==='G'?'Green':g==='Y'?'Yellow':'Red'}</button>))}<div className="gyr-notes"><input placeholder="Note for snapshot…" value={ds.gyrNotes||''} onChange={e=>onSetGyrNotes(d.id,e.target.value)}/></div></div>)}
        <div className="card-actions" onClick={e=>e.stopPropagation()}><button className="act-btn" onClick={()=>onEdit(d.id)}>✏ Edit Checklist</button><button className="act-btn" onClick={()=>onOpenDetail(d.id)}>↗ Open Details</button></div>
        {expanded&&(<div className="exp-detail" onClick={e=>e.stopPropagation()}><div className="pnav">{[1,2,3].map(p=>(<button key={p} className={`pnav-btn ${phase===p?`a${p}`:''}`} onClick={()=>onSetPhase(d.id,p)}>Phase {p}</button>))}</div>{[1,2,3].map(p=>(<div key={p} className="psec"><div className="psec-hd"><span className={`psec-badge ${PCFG[p].bcls}`}>P{p}</span><span className="psec-ttl">{d.phases[p].name}</span></div><ul className="pbullets">{d.phases[p].bullets.map((b,i)=><li key={i}>{b}</li>)}</ul><div className="hwk-callout"><strong>How We Know · </strong>{d.phases[p].hwk}</div></div>))}</div>)}
        <div className={`exp-tog ${expanded?'open':''}`} onClick={()=>setExpanded(e=>!e)}>{expanded?'Collapse roadmap':'View full roadmap'}<ChevIco/></div>
      </div>
    </div>
  );

      <div style={{display:'flex',gap:8,marginBottom:16}}><span style={{fontSize:11,color:'#6b7280',alignSelf:'center'}}>Set current phase:</span>{[1,2,3].map(p=>(<button key={p} className={`pnav-btn ${phase===p?`a${p}`:''}`} style={{flex:'none',padding:'5px 16px'}} onClick={()=>onSetPhase(d.id,p)}>Phase {p}</button>))}</div>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#6b7280',marginBottom:8}}>Full Roadmap</div>
      <table className="roadmap-table"><thead><tr><th className="h1">Phase 1 — Foundation</th><th className="h2">Phase 2 — Operating</th><th className="h3">Phase 3 — Optimizing</th></tr></thead><tbody>{Array.from({length:maxBullets}).map((_,i)=>(<tr key={i}><td className="c1">{d.phases[1].bullets[i]||''}</td><td className="c2">{d.phases[2].bullets[i]||''}</td><td className="c3">{d.phases[3].bullets[i]||''}</td></tr>))}<tr className="roadmap-hwk-row">{[1,2,3].map(p=>(<td key={p} className={`c${p}`}><strong style={{display:'flex',alignItems:'center',gap:6}}>✓ How We Know<span style={{fontSize:8,fontWeight:700,padding:'1px 5px',borderRadius:4,background:'rgba(255,255,255,.08)',color:'#6b7280',cursor:'pointer'}} onClick={e=>{e.stopPropagation();setEditingPhaseHwk(p);setDraftPhaseHwk(getPhaseHwk(d,ds,p));}}>EDIT</span></strong>{editingPhaseHwk===p?<div onClick={e=>e.stopPropagation()}><textarea autoFocus value={draftPhaseHwk} onChange={e=>setDraftPhaseHwk(e.target.value)} style={{width:'100%',marginTop:5,background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.15)',borderRadius:5,padding:'6px 8px',color:'#f1f5f9',fontSize:11,lineHeight:1.5,resize:'vertical',minHeight:70,outline:'none',fontFamily:'inherit'}}/><div style={{display:'flex',gap:6,marginTop:5}}><button className="act-btn" style={{flex:'none',padding:'3px 10px',color:'var(--p1)',borderColor:'var(--p1-border)'}} onClick={()=>{onSavePhaseHwk(d.id,p,draftPhaseHwk);setEditingPhaseHwk(null);}}>Save</button><button className="act-btn" style={{flex:'none',padding:'3px 10px'}} onClick={()=>setEditingPhaseHwk(null)}>Cancel</button></div></div>:<span style={{cursor:'pointer'}} onClick={()=>{setEditingPhaseHwk(p);setDraftPhaseHwk(getPhaseHwk(d,ds,p));}}>{getPhaseHwk(d,ds,p)}</span>}</td>))}</tr></tbody></table>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'#6b7280',marginBottom:8}}>Phase {phase} Checklist</div>
      <div className={`card ${PCFG[phase].cls}`} style={{marginBottom:20}}>
        <div className="hwk" style={{paddingTop:12}}>
          {hwkItems.map((item,i)=>(<div key={i} className="hwk-item" onClick={()=>onToggleHwk(d.id,phase,i)}><div className={`chk ${hwkChecked[i]?'on':''}`}>{hwkChecked[i]&&<CheckIco/>}</div><div className={`hwk-txt ${hwkChecked[i]?'done':''}`}>{item}</div></div>))}
        </div>
      </div>
    </div>
  );
}

function captureSnapshot(domains,states,viewMode){
  const now=new Date(),dateStr=now.toISOString().slice(0,10),label=viewMode==='team'?'Team':'Personal';
  const rows=domains.map(d=>{
    const ds=states[d.id]||{},phase=ds.currentPhase||1;
    const hwkItems=getHwkItems(d,ds,phase);
    const hwkChecked=getHwkChecked(ds,phase);
    const pct=hwkItems.length>0?Math.round(hwkChecked.filter(Boolean).length/hwkItems.length*100):0;
    const gyr=ds.gyrOverride||GYR_AUTO(pct),notes=ds.gyrNotes||'';
    return{d,phase,pct,gyr,notes};
  });
  const G=rows.filter(r=>r.gyr==='G').length,Y=rows.filter(r=>r.gyr==='Y').length,R=rows.filter(r=>r.gyr==='R').length;
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Snapshot — ${dateStr}</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0f1117;color:#e8eaf0;padding:24px;max-width:960px;margin:0 auto}h1{font-size:22px;font-weight:800}h1 span{color:#c9a84c}.meta{font-size:12px;color:#6b7280;margin-bottom:22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.tile{background:#131720;border:1px solid #1e2336;border-radius:10px;padding:14px;text-align:center}.tile-val{font-size:28px;font-weight:800}.tile-lbl{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}.green{color:#22c55e}.yellow{color:#f59e0b}.red{color:#ef4444}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#1e2336;padding:9px 12px;text-align:left;font-size:9px;text-transform:uppercase;color:#94a3b8}td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05)}.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:9px;font-weight:800;text-transform:uppercase}.bG{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}.bY{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}.bR{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)}.bp1{background:#052e16;color:#4ade80;border:1px solid #166534}.bp2{background:#1c1007;color:#fb923c;border:1px solid #7c2d12}.bp3{background:#1a0a2e;color:#c084fc;border:1px solid #581c87}.pb{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.pf{height:100%;border-radius:3px}</style></head><body><h1>Phase Anchor <span>Snapshot</span></h1><div class="meta">${label} · ${now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})} · ${now.toLocaleTimeString()}</div><div class="summary"><div class="tile"><div class="tile-val">${rows.length}</div><div class="tile-lbl">Domains</div></div><div class="tile"><div class="tile-val green">${G}</div><div class="tile-lbl">Green</div></div><div class="tile"><div class="tile-val yellow">${Y}</div><div class="tile-lbl">Yellow</div></div><div class="tile"><div class="tile-val red">${R}</div><div class="tile-lbl">Red</div></div></div><table><thead><tr><th>Domain</th><th>Phase</th><th>Progress</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows.map(({d,phase,pct,gyr,notes})=>{const pn=['Foundation','Operating','Optimizing'][phase-1],bc=phase===1?'#22c55e':phase===2?'#f97316':'#a855f7';return`<tr><td><strong>${d.fullName}</strong></td><td><span class="badge bp${phase}">P${phase} · ${pn}</span></td><td><div style="display:flex;align-items:center;gap:8px"><div class="pb" style="flex:1"><div class="pf" style="width:${pct}%;background:${bc}"></div></div><span style="font-size:11px;font-weight:700;color:#94a3b8">${pct}%</span></div></td><td><span class="badge b${gyr}">${gyr==='G'?'Green':gyr==='Y'?'Yellow':'Red'}</span></td><td style="color:#94a3b8">${notes||'—'}</td></tr>`;}).join('')}</tbody></table></body></html>`;
  const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=Object.assign(document.createElement('a'),{href:url,download:`phase-snapshot-${viewMode}-${dateStr}.html`});a.click();URL.revokeObjectURL(url);
}

function App(){
  const[states,setStates]=useState(loadState),[detail,setDetail]=useState(null),[editId,setEditId]=useState(null),[showGyr,setShowGyr]=useState(false),[toast,setToast]=useState(false);
  const toastTimer=useRef(null);
  useEffect(()=>{saveState(states);setToast(true);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToast(false),1800);},[states]);
  const patchDs=useCallback((id,patch)=>setStates(prev=>{const ds=prev[id]||{};return{...prev,[id]:{...ds,...patch}};}),[]);
  const toggleHwk=useCallback((id,phase,i)=>setStates(prev=>{
    const ds=prev[id]||{};
    const allChecked={...(ds.hwkChecked||{})};
    const phaseChecked=[...(allChecked[phase]||[])];
    phaseChecked[i]=!phaseChecked[i];
    allChecked[phase]=phaseChecked;
    return{...prev,[id]:{...ds,hwkChecked:allChecked}};
  }),[]);
  const savePhaseHwk=useCallback((id,p,text)=>setStates(prev=>{const ds=prev[id]||{},customPhaseHwk={...(ds.customPhaseHwk||{}),[p]:text};return{...prev,[id]:{...ds,customPhaseHwk}};}),[]);
  const saveDates=useCallback((id,dates)=>patchDs(id,{phaseTargetDates:dates}),[patchDs]);
  const setPhase=useCallback((id,p)=>patchDs(id,{currentPhase:p}),[patchDs]);
  const setGyr=useCallback((id,g)=>patchDs(id,{gyrOverride:g}),[patchDs]);
  const setGyrNotes=useCallback((id,n)=>patchDs(id,{gyrNotes:n}),[patchDs]);
  const domains=DOMAINS;
  const totalHwk=domains.reduce((s,d)=>{const ds=states[d.id]||{},phase=ds.currentPhase||1;return s+getHwkItems(d,ds,phase).length;},0);
  const checkedHwk=domains.reduce((s,d)=>{const ds=states[d.id]||{},phase=ds.currentPhase||1;return s+getHwkChecked(ds,phase).filter(Boolean).length;},0);
  const overallPct=totalHwk>0?Math.round(checkedHwk/totalHwk*100):0;
  const phaseCounts=domains.reduce((a,d)=>{const p=(states[d.id]||{}).currentPhase||1;a[p]=(a[p]||0)+1;return a;},{});

  const Header=({sub,children})=>(
    <div className="hdr">
      <div className="hdr-left">
        <div className="hdr-kompass-logo"><KompassLogo/></div>
        <div className="hdr-text"><div className="hdr-title">Phase Anchor</div><div className="hdr-sub">{sub}</div></div>
      </div>
      <div className="hdr-right">{children}</div>
    </div>
  );

  if(detail){
    const dom=DOMAINS.find(d=>d.id===detail);
    return(<div>
      <Header sub="Personal Scoreboard">
        <a href="/phase-anchor-team.html" className="snap-btn">Team View →</a>
        <button className="snap-btn" style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',gap:4}} onClick={()=>setDetail(null)}><BackIco/> Back</button>
      </Header>
      <DetailPage domain={dom} ds={states[dom.id]||{}} onBack={()=>setDetail(null)} onToggleHwk={toggleHwk} onSetPhase={setPhase} onSavePhaseHwk={savePhaseHwk} onSaveDates={saveDates}/>
      <div className={`save-toast ${toast?'show':''}`}>Auto-saved</div>
    </div>);
  }

  const editDomain=editId?DOMAINS.find(d=>d.id===editId):null;
  return(<>
    <Header sub="Personal Scoreboard">
      <a href="/phase-anchor-team.html" className="snap-btn">Team View →</a>
      <button className={`snap-btn ${showGyr?'active':''}`} onClick={()=>setShowGyr(g=>!g)}>{showGyr?'✓ GYR Mode':'⬤ GYR Mode'}</button>
      <button className="snap-btn" onClick={()=>captureSnapshot(domains,states,'personal')}>📸 Snapshot</button>
      <div className="ovr"><div className="ovr-pct">{overallPct}%</div><div className="ovr-lbl">Current phase</div></div>
    </Header>
    <div className="leg"><div className="leg-item"><div className="leg-dot" style={{background:'var(--p1)'}}/><span>Phase 1 — Foundation ({phaseCounts[1]||0})</span></div><div className="leg-item"><div className="leg-dot" style={{background:'var(--p2)'}}/><span>Phase 2 — Operating ({phaseCounts[2]||0})</span></div><div className="leg-item"><div className="leg-dot" style={{background:'var(--p3)'}}/><span>Phase 3 — Optimizing ({phaseCounts[3]||0})</span></div><div className="leg-right">{checkedHwk}/{totalHwk} criteria met</div></div>
    <div className="grid">{domains.map(domain=>(<DomainCard key={domain.id} domain={domain} ds={states[domain.id]||{}} onToggleHwk={toggleHwk} onSetPhase={setPhase} onOpenDetail={setDetail} onEdit={setEditId} onSetGyr={setGyr} onSetGyrNotes={setGyrNotes} showGyr={showGyr}/>))}</div>
    {editDomain&&<EditModal domain={editDomain} ds={states[editId]||{}} phase={(states[editId]||{}).currentPhase||1} onSave={patch=>patchDs(editId,patch)} onClose={()=>setEditId(null)}/>}
    <div className={`save-toast ${toast?'show':''}`}>Auto-saved</div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
