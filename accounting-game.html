<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Accounting Dashboard &#8212; Stitser BUILT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<style>
:root{
  --ink:#0E0D0B;--ink2:#4A4640;--ink3:#8A847C;
  --canvas:#F7F4EF;--paper:#FFFFFF;--rule:#E2DDD6;--rule2:#EDE9E2;
  --gold:#C8961A;--gold-l:#FBF3DE;--gold-d:#9A7010;
  --blue:#1A3F72;--blue-l:#EAF0F9;
  --green:#1E5C36;--green-l:#E4F2E9;
  --teal:#1A6B5A;--teal-l:#E0F2EE;
  --red:#8C1F1F;--red-l:#F9E8E8;
  --amber:#9C5A00;--amber-l:#FEF3E2;
  --purple:#4A2070;--purple-l:#F0EAF8;
  --mono:'DM Mono',monospace;
  --display:'Syne',sans-serif;
  --body:'DM Sans',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:13px;}
body{font-family:var(--body);background:var(--canvas);color:var(--ink);min-height:100vh;}
.app-bar{background:var(--paper);border-bottom:1px solid var(--rule);padding:0 20px;display:flex;align-items:center;gap:0;height:48px;flex-shrink:0;position:sticky;top:0;z-index:100;}
.app-bar-back{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);cursor:pointer;padding:0 14px 0 0;border-right:1px solid var(--rule);margin-right:14px;height:100%;transition:color .15s;text-decoration:none;}
.app-bar-back:hover{color:var(--ink);}
.app-bar-brand{display:flex;align-items:center;gap:8px;flex:1;}
.app-bar-icon{width:28px;height:28px;background:var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.app-bar-title{font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:.01em;}
.app-bar-sub{font-size:10px;color:var(--ink3);margin-left:4px;font-weight:400;}
.app-bar-actions{display:flex;gap:8px;align-items:center;}
.btn{padding:5px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);font-family:var(--body);transition:all .15s;}
.btn:hover{background:var(--canvas);border-color:var(--ink3);}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
.btn.primary:hover{background:#155248;}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn.gold:hover{background:var(--gold-d);}
.btn.ghost{background:transparent;border:none;color:var(--ink3);}
.btn.ghost:hover{color:var(--ink);background:var(--canvas);}
.score-bar{background:var(--ink);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.sb-item{display:flex;flex-direction:column;gap:2px;}
.sb-label{font-size:8px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.sb-val{font-family:var(--mono);font-size:13px;font-weight:500;color:#fff;}
.sb-val.green{color:#4ade80;}.sb-val.red{color:#f87171;}.sb-val.amber{color:#fbbf24;}
.sb-spacer{flex:1;}
.on-track-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.03em;}
.on-track-pill.green{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.on-track-pill.yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3);}
.on-track-pill.red{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);}
.score-dot{width:8px;height:8px;border-radius:50%;}
.score-dot.green{background:#4ade80;}.score-dot.yellow{background:#fbbf24;}.score-dot.red{background:#f87171;}
.period-nav{display:flex;align-items:center;gap:0;padding:0;background:var(--paper);border-bottom:1px solid var(--rule);height:44px;}
.period-nav-btn{width:44px;height:44px;border:none;background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:all .15s;flex-shrink:0;}
.period-nav-btn:hover{background:var(--canvas);color:var(--ink);}
.period-label{font-family:var(--display);font-size:15px;font-weight:800;color:var(--ink);padding:0 8px;min-width:160px;text-align:center;}
.period-tabs{display:flex;gap:0;border-left:1px solid var(--rule);margin-left:8px;height:44px;overflow:hidden;}
.period-tab{padding:0 12px;height:44px;line-height:44px;border-right:1px solid var(--rule);font-size:10px;font-weight:600;cursor:pointer;color:var(--ink3);transition:all .12s;white-space:nowrap;}
.period-tab:hover{background:var(--canvas);color:var(--ink);}
.period-tab.active{background:var(--ink);color:#fff;}
.period-nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;padding-right:16px;}
.toggle-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);}
.toggle{width:36px;height:20px;background:var(--rule2);border-radius:10px;cursor:pointer;position:relative;transition:background .2s;border:1px solid var(--rule);}
.toggle.on{background:var(--teal);border-color:var(--teal);}
.toggle-knob{width:14px;height:14px;background:#fff;border-radius:7px;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-knob{transform:translateX(16px);}
.main{padding:20px;max-width:1200px;}
.del-section{background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.del-section-hdr{display:flex;align-items:center;gap:0;padding:0 16px;height:56px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none;}
.del-section-hdr:hover{background:var(--canvas);}
.del-hdr-color{width:4px;height:36px;border-radius:2px;flex-shrink:0;margin-right:12px;}
.del-hdr-info{flex:1;}
.del-hdr-title{font-family:var(--display);font-size:13px;font-weight:700;color:var(--ink);}
.del-hdr-meta{font-size:10px;color:var(--ink3);margin-top:1px;}
.del-hdr-deadline{display:flex;flex-direction:column;align-items:flex-end;margin:0 16px;gap:1px;flex-shrink:0;}
.del-hdr-date{font-family:var(--mono);font-size:13px;font-weight:700;}
.del-hdr-date.overdue{color:var(--red);}
.del-hdr-date.soon{color:var(--amber);}
.del-hdr-date.ok{color:var(--ink2);}
.del-hdr-days{font-size:9px;font-family:var(--mono);color:var(--ink3);}
.del-hdr-days.overdue{color:var(--red);font-weight:700;}
.del-hdr-days.soon{color:var(--amber);font-weight:700;}
.del-hdr-score{display:flex;align-items:center;gap:8px;}
.del-hdr-prog{width:80px;height:5px;background:var(--rule2);border-radius:3px;overflow:hidden;}
.del-hdr-fill{height:100%;border-radius:3px;transition:width .4s var(--ease);}
.del-hdr-pct{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:28px;text-align:right;}
.del-chev{font-size:10px;color:var(--ink3);transition:transform .2s;margin-left:8px;flex-shrink:0;}
.del-chev.open{transform:rotate(180deg);}
.del-body{border-top:1px solid var(--rule2);}
.del-body.collapsed{display:none;}
/* Financial row: name | drive | gate-check | cfo-checks | status */
.entity-row{display:grid;align-items:start;padding:12px 16px 12px 32px;border-bottom:1px solid var(--rule2);transition:background .1s;gap:0;}
.entity-row:last-child{border-bottom:none;}
.entity-row:hover{background:var(--canvas);}
.entity-row.layout-check{grid-template-columns:240px 1fr 90px;align-items:center;}
.entity-row.layout-financial{grid-template-columns:240px 200px 1fr 90px;}
.er-name{font-size:12px;font-weight:500;color:var(--ink);padding-top:2px;}
.er-name small{display:block;font-size:9px;color:var(--ink3);font-weight:400;margin-top:1px;}
.er-flag{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:3px;font-size:8px;font-weight:700;letter-spacing:.04em;margin-left:5px;vertical-align:middle;}
.er-flag.managed{background:var(--amber-l);color:var(--amber);}
.er-flag.removing{background:var(--red-l);color:var(--red);}
.er-flag.ext{background:var(--blue-l);color:var(--blue);}
.er-check-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.check-item{display:flex;align-items:center;gap:5px;cursor:pointer;padding:3px 6px;border-radius:4px;transition:background .1s;}
.check-item:hover:not(.locked){background:var(--rule2);}
.check-item.locked{cursor:not-allowed;opacity:.45;}
.check-item.locked .check-label{font-style:italic;}
.checkbox{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--rule);background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.checkbox.checked{background:var(--teal);border-color:var(--teal);}
.checkbox.locked-box{background:var(--rule2);border-color:var(--rule);}
.checkbox svg{width:9px;height:9px;}
.check-label{font-size:10px;color:var(--ink3);white-space:nowrap;}
.check-item:hover:not(.locked) .check-label{color:var(--ink);}
.er-status{display:flex;justify-content:flex-end;align-items:flex-start;padding-top:2px;}
.status-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;}
.status-pill.done{background:var(--green-l);color:var(--green);}
.status-pill.partial{background:var(--amber-l);color:var(--amber);}
.status-pill.none{background:var(--rule2);color:var(--ink3);}
.status-pill.na{background:var(--rule2);color:var(--ink3);opacity:.5;}
/* Drive link column */
.er-drive-col{display:flex;flex-direction:column;gap:4px;padding-top:2px;}
.er-drive{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.drive-link-btn{padding:3px 8px;border-radius:4px;border:1px solid var(--rule);background:transparent;cursor:pointer;font-size:10px;color:var(--blue);font-family:var(--body);transition:all .12s;white-space:nowrap;}
.drive-link-btn:hover{background:var(--blue-l);}
.drive-link-btn.active{background:var(--blue-l);border-color:var(--blue);}
.drive-time-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;}
.drive-time-badge.ontime{color:var(--green);background:var(--green-l);}
.drive-time-badge.late{color:var(--red);background:var(--red-l);}
.drive-input-wrap{display:flex;align-items:center;gap:4px;margin-top:3px;}
.drive-input{padding:4px 8px;border:1px solid var(--teal);border-radius:4px;font-size:10px;font-family:var(--mono);background:var(--paper);color:var(--ink);width:220px;outline:none;}
/* Gate column */
.er-gate-col{display:flex;flex-direction:column;gap:6px;padding-top:2px;border-left:2px solid var(--rule2);padding-left:10px;margin-left:4px;}
.gate-section-label{font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px;}
.gate-reviewer{display:flex;align-items:center;gap:5px;margin-bottom:2px;}
.gate-reviewer-name{font-size:10px;color:var(--ink2);font-style:italic;}
.gate-reviewer-edit{font-size:9px;color:var(--ink3);cursor:pointer;padding:1px 4px;border-radius:3px;border:1px solid var(--rule);background:transparent;}
.gate-reviewer-edit:hover{background:var(--canvas);}
.reviewer-input-wrap{display:none;align-items:center;gap:4px;}
.reviewer-input{padding:3px 7px;border:1px solid var(--gold);border-radius:4px;font-size:10px;font-family:var(--body);background:var(--paper);color:var(--ink);width:160px;outline:none;}
.gate-checks{display:flex;flex-direction:column;gap:3px;}
/* Hard gate indicator */
.gate-locked-msg{font-size:9px;color:var(--amber);font-style:italic;padding:2px 6px;background:var(--amber-l);border-radius:3px;margin-top:2px;display:inline-block;}
/* Badges */
.quarterly-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:8px;font-weight:700;letter-spacing:.05em;background:var(--purple-l);color:var(--purple);text-transform:uppercase;margin-left:4px;}
.auto-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:8px;font-weight:700;letter-spacing:.05em;background:var(--green-l);color:var(--green);text-transform:uppercase;margin-left:5px;}
.gate-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:8px;font-weight:700;letter-spacing:.05em;background:var(--gold-l);color:var(--gold-d);text-transform:uppercase;margin-left:5px;}
/* List headers */
.entity-list-hdr{display:grid;padding:5px 16px 5px 32px;background:var(--rule2);border-bottom:1px solid var(--rule);}
.entity-list-hdr.layout-check{grid-template-columns:240px 1fr 90px;}
.entity-list-hdr.layout-financial{grid-template-columns:240px 200px 1fr 90px;}
.entity-list-hdr span{font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
/* GYR */
.gyr-section{background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.gyr-hdr{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;}
.gyr-hdr-title{font-family:var(--display);font-size:13px;font-weight:700;flex:1;}
.gyr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;}
.gyr-item{padding:14px 16px;border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);}
.gyr-item:nth-child(2n){border-right:none;}
.gyr-item:nth-last-child(-n+2){border-bottom:none;}
.gyr-item-label{font-size:11px;font-weight:600;color:var(--ink);margin-bottom:8px;}
.gyr-item-label small{display:block;font-size:10px;color:var(--ink3);font-weight:400;margin-top:2px;}
.gyr-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.gyr-btn{padding:3px 10px;border-radius:4px;border:1px solid;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--body);transition:all .15s;}
.gyr-btn.G{border-color:#bbf7d0;color:var(--green);background:#f0fdf4;}
.gyr-btn.G.sel{background:var(--green);color:#fff;border-color:var(--green);}
.gyr-btn.Y{border-color:#fde68a;color:var(--amber);background:#fffbeb;}
.gyr-btn.Y.sel{background:var(--amber);color:#fff;border-color:var(--amber);}
.gyr-btn.R{border-color:#fecaca;color:var(--red);background:#fef2f2;}
.gyr-btn.R.sel{background:var(--red);color:#fff;border-color:var(--red);}
.gyr-btn:not(.sel){opacity:.5;}
.gyr-note{flex:1;min-width:150px;}
.gyr-note input{width:100%;border:none;border-bottom:1px solid var(--rule);background:transparent;font-size:10px;color:var(--ink);padding:2px 0;outline:none;font-family:var(--body);}
.gyr-note input:focus{border-color:var(--teal);}
.gyr-overall{padding:14px 16px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:12px;background:var(--canvas);}
.gyr-overall-label{font-size:11px;font-weight:700;color:var(--ink);}
/* History */
.hist-section{margin-bottom:14px;}
.hist-strip{display:flex;gap:8px;flex-wrap:wrap;}
.hist-card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 14px;min-width:130px;cursor:pointer;transition:border-color .15s;}
.hist-card:hover{border-color:var(--ink3);}
.hist-period{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px;}
.hist-bar{height:5px;background:var(--rule2);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.hist-fill{height:100%;border-radius:3px;}
.hist-counts{font-family:var(--mono);font-size:10px;color:var(--ink3);}
.hist-gyr{display:flex;gap:4px;margin-top:5px;align-items:center;}
.hist-gyr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
/* CFO panel */
.snap-panel{background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.snap-hdr{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;cursor:pointer;}
.snap-hdr:hover{background:var(--canvas);}
.snap-hdr-title{font-family:var(--display);font-size:12px;font-weight:700;flex:1;}
.snap-body{padding:16px;display:none;}
.snap-body.open{display:block;}
.snap-context{background:var(--canvas);border:1px solid var(--rule);border-radius:6px;padding:12px;font-family:var(--mono);font-size:10px;color:var(--ink2);white-space:pre-wrap;line-height:1.7;max-height:280px;overflow-y:auto;margin-bottom:10px;}
.snap-actions{display:flex;gap:8px;flex-wrap:wrap;}
.section-divider{font-family:var(--display);font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px;display:flex;align-items:center;gap:8px;}
.section-divider::after{content:'';flex:1;height:1px;background:var(--rule);}
.na-row{opacity:.3;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app-bar">
  <a class="app-bar-back" href="/">&#8592; Home</a>
  <div class="app-bar-brand">
    <div class="app-bar-icon">&#128202;</div>
    <div><span class="app-bar-title">Monthly Accounting Dashboard</span><span class="app-bar-sub">Month-End Close</span></div>
  </div>
  <div class="app-bar-actions">
    <span id="last-sync" style="font-size:10px;color:var(--ink3)"></span>
    <button class="btn" onclick="captureSnapshot()">&#128248; Snapshot</button>
    <button class="btn primary" onclick="loadData()">&#10227; Refresh</button>
  </div>
</div>
<div class="score-bar">
  <div class="sb-item"><span class="sb-label">Period</span><span class="sb-val" id="sb-period">&#8212;</span></div>
  <div class="sb-item"><span class="sb-label">Complete</span><span class="sb-val green" id="sb-complete">&#8212;</span></div>
  <div class="sb-item"><span class="sb-label">Overdue</span><span class="sb-val red" id="sb-overdue">&#8212;</span></div>
  <div class="sb-item"><span class="sb-label">Pending</span><span class="sb-val amber" id="sb-pending">&#8212;</span></div>
  <div class="sb-item"><span class="sb-label">Deliverables</span><span class="sb-val" id="sb-total">&#8212;</span></div>
  <div class="sb-spacer"></div>
  <span id="overall-pill" class="on-track-pill yellow"><span class="score-dot yellow"></span> Calculating&#8230;</span>
</div>
<div class="period-nav">
  <button class="period-nav-btn" onclick="shiftPeriod(-1)">&#8249;</button>
  <div class="period-label" id="period-label">&#8212;</div>
  <button class="period-nav-btn" onclick="shiftPeriod(1)">&#8250;</button>
  <div class="period-tabs" id="period-tabs"></div>
  <div class="period-nav-right">
    <div class="toggle-wrap">
      <span>Show BUILT Investment series</span>
      <div class="toggle" id="quarterly-toggle" onclick="toggleQuarterly()"><div class="toggle-knob"></div></div>
    </div>
  </div>
</div>
<div class="main" id="main-content"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
var STORAGE_KEY='sb_monthly_acct_v2';

// ── DELIVERABLES ──────────────────────────────────────────────────────────
// Financial criteria: [0]=Notes vs budget, [1]=Dept reviewed (GATE), [2]=Accurate, [3]=Reviewed by CFO
// Index 3 (CFO) is locked until index 1 (Dept review) is checked — hard gate.
var DELIVERABLES=[
  {id:'pay-apps',title:'Pay Apps Processed',owner:'Project Managers',dueDay:8,color:'#1A3F72',type:'check',
   description:'All active project pay apps submitted',
   criteria:['Submitted on time','Correct G702/G703 format','Complete with backup docs']},
  {id:'cc-receipts',title:'Credit Card Receipts',owner:'All Employees',dueDay:10,color:'#9C5A00',type:'check',
   description:'All employees enter receipts into system',
   criteria:['Receipts entered','Coded to correct GL','Notes / business purpose documented']},
  {id:'ap-ar',title:'AP / AR Entered',owner:'Accounting',dueDay:12,color:'#1A6B5A',type:'check',
   description:'All accounts payable and receivable entered',
   criteria:['AP entered and coded','AR entered','Matched to contracts','AR Collections current']},
  {id:'timesheets',title:'Timesheets Entered',owner:'All Employees',dueDay:11,color:'#4A2070',type:'check',
   description:'All employee timesheets entered (11th and 26th)',
   criteria:['Timesheets entered','Hours verified by manager','Project codes correct']},
  {id:'reconciliations',title:'Bank & CC Reconciliations',owner:'Accounting',dueDay:14,color:'#8C1F1F',type:'check',
   description:'All bank and credit card accounts reconciled',
   criteria:['Bank accounts reconciled','CC accounts reconciled','Discrepancies resolved']},
  {id:'financials',title:'Financial Statements',owner:'Accounting',dueDay:15,color:'#1E5C36',type:'financial',
   description:'P&L, Balance Sheet, Cash Flow delivered and reviewed',
   // criteria indices: 0=Notes vs budget, 1=Dept reviewed (GATE), 2=Accurate, 3=CFO sign-off

// ── HELPERS ───────────────────────────────────────────────────────────────
function todayYM(){return new Date().toISOString().slice(0,7);}
function ymToLabel(ym){var p=ym.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleString('en',{month:'long',year:'numeric'});}
function ymShift(ym,d){var p=ym.split('-').map(Number);var ny=p[0],nm=p[1]+d;if(nm<1){nm+=12;ny--;}else if(nm>12){nm-=12;ny++;}return ny+'-'+String(nm).padStart(2,'0');}
function dueDateForYM(ym,dueDay){var p=ym.split('-').map(Number);return p[0]+'-'+String(p[1]).padStart(2,'0')+'-'+String(dueDay).padStart(2,'0');}
function fmtDateFull(d){if(!d)return'--';return new Date(d+'T12:00:00').toLocaleString('en',{month:'short',day:'numeric',year:'numeric'});}
function fmtDateShort(d){if(!d)return'--';return new Date(d+'T12:00:00').toLocaleString('en',{month:'short',day:'numeric'});}
function daysFromToday(ds){var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds+'T00:00:00')-t)/(864e5));}
function isQuarterEnd(ym){return[3,6,9,12].includes(parseInt(ym.split('-')[1]));}
function entityInDel(entity,delId){return entity.delMask.indexOf(delId)>=0;}

// ── PERSISTENCE ───────────────────────────────────────────────────────────
function loadData(){
  try{var s=localStorage.getItem(STORAGE_KEY);DATA=s?JSON.parse(s):{};}catch(e){DATA={};}
  // Load reviewer names saved in data
  ENTITIES.forEach(function(e){
    if(DATA._reviewers&&DATA._reviewers[e.id])e.reviewer=DATA._reviewers[e.id];
  });
  document.getElementById('last-sync').textContent='Updated '+new Date().toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'});
  render();
}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA));}catch(e){}}
function getPD(ym){if(!DATA[ym])DATA[ym]={deliverables:{},gyr:{}};return DATA[ym];}
function getDD(ym,delId,entityId){var pd=getPD(ym);if(!pd.deliverables[delId])pd.deliverables[delId]={};if(!pd.deliverables[delId][entityId])pd.deliverables[delId][entityId]={criteria:[]};return pd.deliverables[delId][entityId];}
function saveReviewer(entityId,name){if(!DATA._reviewers)DATA._reviewers={};DATA._reviewers[entityId]=name;saveData();}

// ── BUSINESS LOGIC ────────────────────────────────────────────────────────
function activeEntities(){return ENTITIES.filter(function(e){return SHOW_QUARTERLY||!e.quarterly;});}
function isApplicable(entity,del,ym){
  if(!entityInDel(entity,del.id))return false;
  if(entity.quarterly&&!isQuarterEnd(ym))return false;
  return true;
}
function financialAutoStatus(ym,del,dd2){
  var driveLinked=!!dd2.driveLink;
  var onTime=false;
  if(driveLinked){
    if(dd2.driveLinkedAt){onTime=new Date(dd2.driveLinkedAt+'T00:00:00')<=new Date(dueDateForYM(ym,del.dueDay)+'T00:00:00');}
    else{onTime=daysFromToday(dueDateForYM(ym,del.dueDay))>=0;}
  }
  return{driveLinked:driveLinked,onTime:onTime};
}
function entityDelStatus(ym,del,entity){
  if(!isApplicable(entity,del,ym))return'na';
  var dd=getDD(ym,del.id,entity.id);
  if(del.type==='financial'){
    var auto=financialAutoStatus(ym,del,dd);
    var crit=dd.criteria||[];
    // Done = drive link + all 4 manual criteria checked
    var manualDone=crit.filter(Boolean).length>=del.criteria.length;
    if(auto.driveLinked&&manualDone)return'done';
    if(auto.driveLinked||crit.some(Boolean))return'partial';
    return'none';
  }
  var filled=(dd.criteria||[]).filter(Boolean).length;
  var total=del.criteria.length;
  if(filled===0)return'none';
  if(filled<total)return'partial';
  return'done';
}
function delPct(ym,del){
  var ents=activeEntities().filter(function(e){return isApplicable(e,del,ym);});
  if(!ents.length)return 0;
  return Math.round(ents.filter(function(e){return entityDelStatus(ym,del,e)==='done';}).length/ents.length*100);
}
function overallStats(ym){
  var total=0,done=0,overdue=0;
  var today=new Date();today.setHours(0,0,0,0);
  DELIVERABLES.forEach(function(del){
    var isOver=new Date(dueDateForYM(ym,del.dueDay)+'T00:00:00')<today;
    activeEntities().forEach(function(e){
      if(!isApplicable(e,del,ym))return;
      total++;
      var st=entityDelStatus(ym,del,e);
      if(st==='done')done++;else if(isOver)overdue++;
    });
  });
  return{total:total,done:done,overdue:overdue,pending:total-done-overdue};
}
function computeOT(ym){
  var gyr=(DATA[ym]||{}).gyr||{};
  var rated=GYR_AXES.map(function(a){return gyr[a.id];}).filter(Boolean);
  if(!rated.length){var s=overallStats(ym);var p=s.done/(s.total||1);return p>=.85?'green':p>=.5?'yellow':'red';}
  var reds=rated.filter(function(r){return r==='R';}).length;
  var yellows=rated.filter(function(r){return r==='Y';}).length;
  if(reds>=2)return'red';if(reds>=1||yellows>=2)return'yellow';return'green';
}

function toggleCriteria(ym,delId,entityId,cIdx){
  var del=getDelById(delId);
  var dd=getDD(ym,delId,entityId);
  if(!dd.criteria)dd.criteria=[];
  // Hard gate: if trying to check the locked index, require gate index first
  if(del.lockedIdx!==undefined&&cIdx===del.lockedIdx){
    if(!dd.criteria[del.gateIdx]){showToast('&#128274; Dept review must be confirmed first');return;}
  }
  dd.criteria[cIdx]=!dd.criteria[cIdx];
  // If unchecking the gate, also uncheck the locked item
  if(del.gateIdx!==undefined&&cIdx===del.gateIdx&&!dd.criteria[cIdx]){
    dd.criteria[del.lockedIdx]=false;
  }
  saveData();
  renderDelSection(delId);
  renderScoreBar();
}

          +'<span class="check-label">'+c+'</span></div>';
      }).join(''):'';
      rows+='<div class="'+rc+'"><div class="er-name">'+entity.name+qBadge+flagHTML+'<small>'+entity.sub+'</small></div><div class="er-check-row">'+checks+'</div><div class="er-status">'+statusHTML+'</div></div>';
    }
  });

  return'<div class="del-section" id="del-section-'+del.id+'">'
    +'<div class="del-section-hdr" onclick="toggleSection(\''+del.id+'\')">'
    +'<div class="del-hdr-color" style="background:'+del.color+'"></div>'
    +'<div class="del-hdr-info"><div class="del-hdr-title">'+del.title+'</div><div class="del-hdr-meta">'+del.owner+' &middot; '+del.description+'</div></div>'
    +'<div class="del-hdr-deadline"><div class="del-hdr-date '+dc+'">'+fmtDateFull(ddStr)+'</div><div class="del-hdr-days '+dc+'">'+dl+' &middot; '+cnt+' entities</div></div>'
    +'<div class="del-hdr-score"><div class="del-hdr-prog"><div class="del-hdr-fill" style="width:'+pct+'%;background:'+fc+'"></div></div><span class="del-hdr-pct">'+pct+'%</span></div>'
    +'<span class="del-chev '+(ic?'':'open')+'" id="del-chev-'+del.id+'">&#9662;</span></div>'
    +'<div class="del-body'+(ic?' collapsed':'')+'" id="del-body-'+del.id+'">'+hdrRow+rows+'</div></div>';
}

function renderDelSection(delId){
  var del=getDelById(delId);if(!del)return;
  var sec=document.getElementById('del-section-'+del.id);if(!sec)return;
  var tmp=document.createElement('div');tmp.innerHTML=renderDelHTML(del);
  sec.parentNode.replaceChild(tmp.firstChild,sec);
}

function renderGYRHTML(){
  var ym=CUR_YM,gyr=(DATA[ym]||{}).gyr||{},notes=(DATA[ym]||{}).gyrNotes||{},ot=computeOT(ym);
  var otL={green:'&#10003; On Track',yellow:'&#9888; At Risk',red:'&#10005; Off Track'};
  var items=GYR_AXES.map(function(a){
    var cur=gyr[a.id],note=notes[a.id]||'';
    var btns=['G','Y','R'].map(function(g){return'<button class="gyr-btn '+g+(cur===g?' sel':'')+'" onclick="setGYR(\''+ym+'\',\''+a.id+'\',\''+g+'\')">'+(g==='G'?'Green':g==='Y'?'Yellow':'Red')+'</button>';}).join('');
    return'<div class="gyr-item"><div class="gyr-item-label">'+a.label+'<small>'+a.desc+'</small></div><div class="gyr-btns">'+btns+'<div class="gyr-note"><input placeholder="Notes..." value="'+note+'" oninput="setGYRNote(\''+ym+'\',\''+a.id+'\',this.value)"></div></div></div>';
  }).join('');
  return'<div class="gyr-section" id="gyr-section"><div class="gyr-hdr"><span style="font-size:16px">&#128202;</span><div class="gyr-hdr-title">Quality Assessment &#8212; '+ymToLabel(ym)+'</div></div><div class="gyr-grid">'+items+'</div><div class="gyr-overall"><span class="gyr-overall-label">Overall:</span><span class="on-track-pill '+ot+'" style="font-size:11px">'+otL[ot]+'</span><span style="font-size:10px;color:var(--ink3);margin-left:8px">GYR-scored &middot; falls back to completion % when unscored</span></div></div>';
}
function renderGYRSection(){var s=document.getElementById('gyr-section');if(!s)return;var t=document.createElement('div');t.innerHTML=renderGYRHTML();s.parentNode.replaceChild(t.firstChild,s);}

function renderHistHTML(){
  var cards=[-5,-4,-3,-2,-1].map(function(d){return ymShift(CUR_YM,d);}).map(function(ym){
    var ents=activeEntities();
    var total=DELIVERABLES.reduce(function(s,d){return s+ents.filter(function(e){return isApplicable(e,d,ym);}).length;},0);
    var done=DELIVERABLES.reduce(function(s,d){return s+ents.filter(function(e){return entityDelStatus(ym,d,e)==='done';}).length;},0);
    var pct=total?Math.round(done/total*100):0;
    var ot=computeOT(ym);
    var fc=pct===100?'var(--green)':pct>=60?'var(--gold)':'var(--red)';
    var p=ym.split('-');var lbl=new Date(+p[0],+p[1]-1,1).toLocaleString('en',{month:'short',year:'numeric'});
    return'<div class="hist-card" onclick="selectPeriod(\''+ym+'\')"><div class="hist-period">'+lbl+'</div>'
      +'<div class="hist-bar"><div class="hist-fill" style="width:'+pct+'%;background:'+fc+'"></div></div>'
      +'<div class="hist-counts">'+done+'/'+total+' complete</div>'
      +'<div class="hist-gyr"><div class="hist-gyr-dot" style="background:'+(ot==='green'?'var(--green)':ot==='yellow'?'var(--gold)':'var(--red)')+'"></div>'
      +'<span style="font-size:9px;color:var(--ink3);margin-left:3px">'+(ot==='green'?'On Track':ot==='yellow'?'At Risk':'Off Track')+'</span></div></div>';
  }).join('');
  return'<div class="hist-section"><div class="hist-strip">'+cards+'</div></div>';
}

function renderSnapHTML(){
  return'<div class="snap-panel"><div class="snap-hdr" onclick="toggleSnap()"><span style="font-size:14px">&#129302;</span><div class="snap-hdr-title">CFO Review Context &#8212; Click to expand</div><span id="snap-chev" style="font-size:10px;color:var(--ink3)">&#9660;</span></div>'
    +'<div class="snap-body" id="snap-body"><div class="snap-context" id="snap-ctx">Loading...</div>'
    +'<div class="snap-actions"><button class="btn primary" onclick="copyCtx()">Copy Context</button><button class="btn gold" onclick="captureSnapshot()">&#128248; Download Snapshot</button>'
    +'<span style="font-size:10px;color:var(--ink3);align-self:center">Paste into Arbitrage CFO plugin for cross-entity review</span></div></div></div>';
}
function toggleSnap(){var b=document.getElementById('snap-body');var c=document.getElementById('snap-chev');if(!b)return;var o=b.classList.toggle('open');if(c)c.textContent=o?'&#9650;':'&#9660;';if(o)genCtx();}
function genCtx(){
  var ym=CUR_YM,period=ymToLabel(ym),ot=computeOT(ym);
  var otL={green:'ON TRACK',yellow:'AT RISK',red:'OFF TRACK'}[ot];
  var gyr=(DATA[ym]||{}).gyr||{},notes=(DATA[ym]||{}).gyrNotes||{},s=overallStats(ym);
  var ctx='MONTHLY ACCOUNTING DASHBOARD -- '+period.toUpperCase()+'\n';
  ctx+='Generated: '+new Date().toLocaleString('en',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})+'\n';
  ctx+='Status: '+otL+'\n------------------------------------------------------------\n\n';
  ctx+='COMPLETION: '+s.done+'/'+s.total+' ('+Math.round(s.done/(s.total||1)*100)+'%) -- '+s.overdue+' overdue, '+s.pending+' pending\n\n';
  ctx+='QUALITY SCORECARD:\n';
  GYR_AXES.forEach(function(a){ctx+='  '+a.label+': '+(gyr[a.id]||'--')+(notes[a.id]?' ('+notes[a.id]+')':'')+'\n';});
  var fin=DELIVERABLES.filter(function(d){return d.id==='financials';})[0];
  var ents=activeEntities();
  ctx+='\nFINANCIAL STATEMENTS:\n';
  ents.forEach(function(entity){
    var dd2=getDD(ym,'financials',entity.id);
    if(!isApplicable(entity,fin,ym))return;
    var st=entityDelStatus(ym,fin,entity);
    var crit=dd2.criteria||[];
    var deptDone=!!crit[fin.gateIdx];var cfoDone=!!crit[fin.lockedIdx];
    ctx+='  ['+{done:'DONE',partial:'PARTIAL',none:'PENDING'}[st]+'] '+entity.name
      +(dd2.driveLink?' -> '+dd2.driveLink:'')
      +' | Dept: '+(deptDone?'Yes':'No')+' | CFO: '+(cfoDone?'Yes':'No')+'\n';
  });
  ctx+='\nGAPS:\n';
  DELIVERABLES.forEach(function(del){
    var inc=ents.filter(function(e){return isApplicable(e,del,ym)&&entityDelStatus(ym,del,e)!=='done';});
    if(!inc.length)return;
    ctx+='  '+del.title+' (due '+fmtDateShort(dueDateForYM(ym,del.dueDay))+'): '+inc.map(function(e){return e.name;}).join(', ')+'\n';
  });
  ctx+='\n------------------------------------------------------------\nREVIEW SEQUENCE:\n';
  var i=0;ents.forEach(function(entity){
    var dd2=getDD(ym,'financials',entity.id);
    if(!isApplicable(entity,fin,ym)||!dd2.driveLink)return;
    i++;ctx+='  '+i+'. '+entity.name+(entity.reviewer?' [Reviewer: '+entity.reviewer+']':'')+' -> '+dd2.driveLink+'\n';
  });
  ctx+='\nFor each entity: P&L vs budget, GP margin variance, overhead rate, cash position vs prior month.';
  var el=document.getElementById('snap-ctx');if(el)el.textContent=ctx;
}
function copyCtx(){genCtx();var t=(document.getElementById('snap-ctx')||{}).textContent||'';if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){showToast('Context copied');});}

function captureSnapshot(){
  var ym=CUR_YM,period=ymToLabel(ym),ot=computeOT(ym);
  var gyr=(DATA[ym]||{}).gyr||{},notes=(DATA[ym]||{}).gyrNotes||{},s=overallStats(ym),ents=activeEntities(),now=new Date();
  var otC={green:'#22c55e',yellow:'#f59e0b',red:'#ef4444'}[ot];
  var otL={green:'ON TRACK',yellow:'AT RISK',red:'OFF TRACK'}[ot];
  var fin=DELIVERABLES.filter(function(d){return d.id==='financials';})[0];
  var dRows=DELIVERABLES.map(function(del){
    var pct=delPct(ym,del),dd=dueDateForYM(ym,del.dueDay),isO=daysFromToday(dd)<0&&pct<100;
    var fc=pct===100?'#22c55e':pct>=50?'#f59e0b':'#ef4444';
    return'<tr><td><strong>'+del.title+'</strong></td><td style="font-size:11px">'+fmtDateFull(dd)+(isO?' &#9888;':'')+'</td><td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden"><div style="height:100%;background:'+fc+';width:'+pct+'%"></div></div><span style="font-weight:700">'+pct+'%</span></div></td></tr>';
  }).join('');
  var gRows=GYR_AXES.map(function(a){
    var g=gyr[a.id],gc={G:'#22c55e',Y:'#f59e0b',R:'#ef4444'}[g]||'#374151';
    return'<tr><td>'+a.label+'</td><td><span style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:'+(g?gc+'33':'rgba(255,255,255,.06)')+';color:'+(g?gc:'#6b7280')+'">'+({G:'GREEN',Y:'YELLOW',R:'RED'}[g]||'--')+'</span></td><td style="color:#9ca3af;font-size:10px">'+(notes[a.id]||'--')+'</td></tr>';
  }).join('');
  var fRows=ents.map(function(entity){
    var dd2=getDD(ym,'financials',entity.id);
    if(!isApplicable(entity,fin,ym))return'';
    var st=entityDelStatus(ym,fin,entity);
    var crit=dd2.criteria||[];
    return'<tr><td>'+entity.name+'<br><span style="font-size:9px;opacity:.5">'+entity.sub+'</span></td>'
      +'<td>'+(dd2.driveLink?'<a href="'+dd2.driveLink+'" style="color:#60a5fa;font-size:11px" target="_blank">Open Drive</a>':'<span style="opacity:.4">Not filed</span>')+'</td>'
      +'<td style="font-size:10px">'+(crit[fin.gateIdx]?'&#10003;':'&#9719;')+' Dept &nbsp; '+(crit[fin.lockedIdx]?'&#10003;':'&#9719;')+' CFO</td>'
      +'<td><span style="font-size:10px;font-weight:700;color:'+({done:'#22c55e',partial:'#f59e0b',none:'#6b7280'}[st]||'#6b7280')+'">'+{done:'Done',partial:'Partial',none:'Pending'}[st]+'</span></td></tr>';
  }).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MAD Snapshot -- '+period+'</title>'
    +'<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0f1117;color:#e8eaf0;padding:28px;max-width:1000px;margin:0 auto}'
    +'h1{font-size:22px;font-weight:800}h1 span{color:#c9a84c}.meta{font-size:12px;color:#6b7280;margin-bottom:22px}'
    +'.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}'
    +'.tile{background:#131720;border:1px solid #1e2336;border-radius:10px;padding:14px;text-align:center}'
    +'.tv{font-size:26px;font-weight:800}.tl{font-size:9px;color:#6b7280;text-transform:uppercase;margin-top:3px}'
    +'.sec{margin-bottom:28px}.st{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b7280;margin-bottom:10px;border-bottom:1px solid #1e2336;padding-bottom:6px}'
    +'table{width:100%;border-collapse:collapse;font-size:12px}th{background:#1e2336;padding:9px 12px;text-align:left;font-size:9px;text-transform:uppercase;color:#94a3b8}td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05)}'
    +'</style></head><body>'
    +'<h1>Monthly Accounting <span>Dashboard</span></h1>'
    +'<div class="meta">'+period+' &middot; '+now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' &middot; '+now.toLocaleTimeString()+'</div>'
    +'<div class="sum">'
    +'<div class="tile"><div class="tv">'+s.done+'/'+s.total+'</div><div class="tl">Complete</div></div>'
    +'<div class="tile"><div class="tv" style="color:#f87171">'+s.overdue+'</div><div class="tl">Overdue</div></div>'
    +'<div class="tile"><div class="tv" style="color:#fbbf24">'+s.pending+'</div><div class="tl">Pending</div></div>'
    +'<div class="tile"><div class="tv">'+Math.round(s.done/(s.total||1)*100)+'%</div><div class="tl">Complete</div></div>'
    +'<div class="tile"><div style="display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:800;background:'+otC+'22;color:'+otC+';border:1px solid '+otC+'44">'+otL+'</div><div class="tl">Status</div></div>'
    +'</div>'
    +'<div class="sec"><div class="st">Deliverable Completion</div><table><thead><tr><th>Deliverable</th><th>Due Date</th><th>Completion</th></tr></thead><tbody>'+dRows+'</tbody></table></div>'
    +'<div class="sec"><div class="st">Quality Scorecard</div><table><thead><tr><th>Dimension</th><th>Rating</th><th>Notes</th></tr></thead><tbody>'+gRows+'</tbody></table></div>'
    +'<div class="sec"><div class="st">Financial Statements</div><table><thead><tr><th>Entity</th><th>Drive Link</th><th>Review</th><th>Status</th></tr></thead><tbody>'+fRows+'</tbody></table></div>'
    +'</body></html>';
  var blob=new Blob([html],{type:'text/html'});var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='monthly-accounting-'+ym+'.html';a.click();
  URL.revokeObjectURL(url);showToast('Snapshot saved');
}
function showToast(msg){var t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2800);}
loadData();
</script>
